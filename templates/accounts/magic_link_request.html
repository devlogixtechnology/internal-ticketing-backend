{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Request Magic Link</h3>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'accounts:magic_link_request' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required>
                    <div class="form-text">We will send you a temporary login link valid for 15 minutes.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Send Magic Link</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
