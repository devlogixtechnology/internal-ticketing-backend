{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center p-4">
        {% if success %}
            <div class="text-success mb-3">
                <i class="bi bi-check-circle-fill display-1"></i>
            </div>
            <h3 class="card-title text-success">Login Successful!</h3>
            <p class="text-muted mt-2">{{ message }}</p>
            <p>Welcome back, <strong>{{ user.get_full_name|default:user.username }}</strong>!</p>
            <a href="{% url 'tickets:ticket_list' %}" class="btn btn-primary mt-3">Go to Dashboard</a>
        {% else %}
            <div class="text-danger mb-3">
                <i class="bi bi-x-circle-fill display-1"></i>
            </div>
            <h3 class="card-title text-danger">Authentication Failed</h3>
            <p class="text-muted mt-2">{{ message }}</p>
            <a href="{% url 'accounts:magic_link_request' %}" class="btn btn-outline-primary mt-3">Request New Link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
